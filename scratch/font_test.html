<!DOCTYPE html>
<html>
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
body { background: #07040C; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
</style>
</head>
<body>
<svg width="960" height="480" viewBox="0 0 960 480">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7" />
      <stop offset="25%" stop-color="#FDE68A" />
      <stop offset="60%" stop-color="#E9B85B" />
      <stop offset="100%" stop-color="#C99A45" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <text x="480" y="190" text-anchor="middle" font-family="'Alex Brush', cursive" font-size="96" fill="url(#goldGrad)" filter="url(#glow)">I Love You,</text>
  <text x="510" y="300" text-anchor="middle" font-family="'Alex Brush', cursive" font-size="110" fill="url(#goldGrad)" filter="url(#glow)">Uci</text>
</svg>
</body>
</html>
